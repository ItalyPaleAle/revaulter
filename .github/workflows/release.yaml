# Builds the application and makes releases

name: Build and release

on:
  push:
    branches:
      - main
    tags:
      # Push to tags matching v*
      - 'v*'
  workflow_dispatch:
    inputs:
      build_all_platforms:
        description: Build binaries and container images for all supported platforms
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:

  build:
    name: Build and release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          # Do not cache in release workflows
          cache: false

      - name: Setup Node.js and pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          package-json-file: 'client/web/package.json'
          # Do not cache in release workflows
          cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          # Do not cache in release workflows
          cache-binary: false

      # Lowercase REPO_OWNER which is required for containers
      - name: Set lowercase REPO_OWNER
        run: |
          REPO_OWNER=${{ github.repository_owner }}
          echo "REPO_OWNER=${REPO_OWNER,,}" >>${GITHUB_ENV}

      - name: Generate Container tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ env.REPO_OWNER }}/revaulter
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch

      - name: Generate Container tags and labels for CLI
        id: meta-cli
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ env.REPO_OWNER }}/revaulter-cli
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch

      - name: Generate Container tags and labels for revaulter-edit
        id: meta-edit
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ env.REPO_OWNER }}/revaulter-edit
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch

      - name: Set variables
        run: |
          BUILD_ID=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          BUILD_VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          COMMIT_HASH=$(echo "${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}" | head -c 7)

          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV
          echo "BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_ENV
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV

          echo "BUILD_ID: '$BUILD_ID'"
          echo "BUILD_VERSION: '$BUILD_VERSION'"
          echo "BUILD_DATE: '$BUILD_DATE'"
          echo "COMMIT_HASH: '$COMMIT_HASH'"

          BUILDINFO_PKG="github.com/italypaleale/revaulter/internal/buildinfo"
          REPO_URL="https://github.com/${{ github.repository }}"
          # This is injected into the CLI as a regex fragment, so keep it regex-safe
          SIGNING_BRANCH_REF_PATTERN='heads/main'
          SIGNING_REF_PATTERN="tags/v.+|${SIGNING_BRANCH_REF_PATTERN}"
          BUILD_LDFLAGS="-s -w -X ${BUILDINFO_PKG}.Production=1 -X ${BUILDINFO_PKG}.AppVersion=${BUILD_VERSION} -X ${BUILDINFO_PKG}.BuildId=${BUILD_ID} -X ${BUILDINFO_PKG}.BuildDate=${BUILD_DATE} -X ${BUILDINFO_PKG}.CommitHash=${COMMIT_HASH} -X ${BUILDINFO_PKG}.RepoURL=${REPO_URL} -X ${BUILDINFO_PKG}.SigningRefPattern=${SIGNING_REF_PATTERN} -buildid=${BUILD_ID}"

          echo "BUILD_LDFLAGS=$BUILD_LDFLAGS" >> $GITHUB_ENV
          echo "SIGNING_BRANCH_REF_PATTERN=$SIGNING_BRANCH_REF_PATTERN" >> $GITHUB_ENV
          echo "SIGNING_REF_PATTERN=$SIGNING_REF_PATTERN" >> $GITHUB_ENV

          echo "BUILD_LDFLAGS: '$BUILD_LDFLAGS'"
          echo "SIGNING_REF_PATTERN: '$SIGNING_REF_PATTERN'"

      - name: Select build platforms
        env:
          INPUT_BUILD_ALL_PLATFORMS: ${{ inputs.build_all_platforms }}
        run: |
          build_all_platforms=false
          container_platforms='linux/amd64,linux/arm64/v8'

          if [[ "${GITHUB_REF}" =~ ^refs/tags/v ]]; then
            build_all_platforms=true
            container_platforms='linux/amd64,linux/arm64/v8,linux/arm/v7'
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${INPUT_BUILD_ALL_PLATFORMS}" == 'true' ]]; then
            build_all_platforms=true
            container_platforms='linux/amd64,linux/arm64/v8,linux/arm/v7'
          fi

          echo "BUILD_ALL_PLATFORMS=$build_all_platforms" >> "$GITHUB_ENV"
          echo "CONTAINER_PLATFORMS=$container_platforms" >> "$GITHUB_ENV"

          echo "BUILD_ALL_PLATFORMS: '$build_all_platforms'"
          echo "CONTAINER_PLATFORMS: '$container_platforms'"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install web client dependencies
        working-directory: client/web
        run: |
          pnpm install --frozen-lockfile

      - name: Build web client
        working-directory: client/web
        run: |
          ./build.sh

      # Integrity manifest: signs the web client dist/ contents with cosign keyless
      # Always runs on tag releases; on configured release-branch pushes, only when the head commit
      # carries a `Sign-Web-Client: yes` trailer (parsed via `git interpret-trailers`)
      - name: Decide whether to sign web client
        id: sign_gate
        run: |
          should_sign=false
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v ]]; then
            should_sign=true
          elif [[ "${GITHUB_REF#refs/}" =~ ^(${SIGNING_BRANCH_REF_PATTERN})$ ]]; then
            if git log -1 --format=%B \
               | git interpret-trailers --parse \
               | grep -qi '^Sign-Web-Client: yes'; then
              should_sign=true
            fi
          fi
          echo "should_sign=$should_sign" >> "$GITHUB_OUTPUT"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "Signing web client: $should_sign"

      - name: Install cosign
        if: steps.sign_gate.outputs.should_sign == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build integrity manifest
        if: steps.sign_gate.outputs.should_sign == 'true'
        run: |
          mkdir -p internal/server/integrity
          go run ./tools/build-manifest \
            --dist client/web/dist \
            --version "${BUILD_VERSION}" \
            --commit "${COMMIT_HASH}" \
            --build-date "${BUILD_DATE}" \
            --out internal/server/integrity/manifest.txt

            echo "Manifest:"
            cat internal/server/integrity/manifest.txt

      - name: Sign integrity manifest (cosign keyless)
        if: steps.sign_gate.outputs.should_sign == 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --bundle internal/server/integrity/manifest.sigstore.json \
            internal/server/integrity/manifest.txt

      - name: Build binaries
        env:
          CGO_ENABLED: "0"
        run: |
          ./scripts/build-binaries.sh linux-amd64
          ./scripts/build-binaries.sh linux-arm64

          if [[ "${BUILD_ALL_PLATFORMS}" == 'true' ]]; then
            for target in linux-386 linux-armv7 macos-x64 macos-arm64 windows-x64 windows-arm64 freebsd-amd64 freebsd-arm64; do
              ./scripts/build-binaries.sh "${target}"
            done
          else
            echo -e "\n###\nSkipping non-default platforms for this run\n"
          fi

          echo -e "\n###\nLinks for Docker buildx\n"
          (
            cd .bin && \
            ln -v -s revaulter-${{ env.BUILD_ID }}-linux-amd64 linux-amd64 && \
            ln -v -s revaulter-${{ env.BUILD_ID }}-linux-arm64 linux-arm64
          )

          if [[ "${BUILD_ALL_PLATFORMS}" == 'true' ]]; then
            (
              cd .bin && \
              ln -v -s revaulter-${{ env.BUILD_ID }}-linux-armv7 linux-arm
            )
          fi

          echo -e "\n###\nCompilation done\n"
          echo ".bin:"
          ls -al .bin
          echo ".out:"
          ls -al .out

      - name: Generate checksums
        working-directory: .out
        run: |
          shopt -s nullglob
          files=(revaulter-*.tar.gz revaulter-*.zip)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No release archives found in .out"
            exit 1
          fi

          sha256sum "${files[@]}" | sort -k 2 > checksums.txt

          echo "checksums.txt:"
          cat checksums.txt

      - name: Build and push Container images
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: docker-build-push
        with:
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ env.CONTAINER_PLATFORMS }}
          context: .
          file: Dockerfile
          push: true

      - name: Build and push Container images for CLI
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: docker-build-push-cli
        with:
          tags: ${{ steps.meta-cli.outputs.tags }}
          labels: ${{ steps.meta-cli.outputs.labels }}
          platforms: ${{ env.CONTAINER_PLATFORMS }}
          context: .
          file: Dockerfile-cli
          push: true

      - name: Build and push Container images for revaulter-edit
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: docker-build-push-edit
        with:
          tags: ${{ steps.meta-edit.outputs.tags }}
          labels: ${{ steps.meta-edit.outputs.labels }}
          platforms: ${{ env.CONTAINER_PLATFORMS }}
          context: .
          file: Dockerfile-edit
          push: true

      # A single attestation covering every file attached to the release: the archives plus checksums.txt
      - name: Attestation for release archives
        id: attest-archives
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # 4.2.1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: '.out/*'

      # Attached to the release so the provenance can also be verified offline, with `gh attestation verify <archive> --bundle attestations.json`
      - name: Stage attestation bundle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BUNDLE_PATH: ${{ steps.attest-archives.outputs.bundle-path }}
        run: |
          cp "${BUNDLE_PATH}" .out/attestations.json

          echo "Attestations: $(wc -l < .out/attestations.json)"

      - name: Publish binaries as Actions Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts
          path: .out
          include-hidden-files: true
          compression-level: 0

      - name: Container image attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # 4.2.1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-name: 'ghcr.io/${{ env.REPO_OWNER }}/revaulter'
          subject-digest: ${{ steps.docker-build-push.outputs.digest }}
          push-to-registry: true

      - name: Container image attestation for CLI
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # 4.2.1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-name: 'ghcr.io/${{ env.REPO_OWNER }}/revaulter-cli'
          subject-digest: ${{ steps.docker-build-push-cli.outputs.digest }}
          push-to-registry: true

      - name: Container image attestation for revaulter-edit
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # 4.2.1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-name: 'ghcr.io/${{ env.REPO_OWNER }}/revaulter-edit'
          subject-digest: ${{ steps.docker-build-push-edit.outputs.digest }}
          push-to-registry: true

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}

    steps:

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the tag so its annotation message is available for release notes
          fetch-tags: true

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts
          path: .out

      - name: Publish release
        run: |
          # Published releases are immutable: re-running the workflow on the same tag must fail, not overwrite
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists, and published releases are immutable"
            exit 1
          fi

          # Tags carrying a pre-release identifier (such as v1.2.0-rc.1) are marked as pre-releases
          prerelease=()
          if [[ "${TAG}" == *-* ]]; then
            echo "Marking ${TAG} as a pre-release"
            prerelease=(--prerelease)
          fi

          # An annotated tag carries a message; use it as the release notes.
          # A lightweight tag has no message, so fall back to auto-generated notes.
          notes_args=()
          tag_type=$(git tag -l --format='%(objecttype)' "${TAG}")
          if [[ "${tag_type}" == "tag" ]]; then
            tag_message=$(git tag -l --format='%(contents)' "${TAG}")
            if [[ -n "${tag_message}" ]]; then
              echo "Using tag annotation as release notes"
              notes_args=(--notes "${tag_message}")
            fi
          fi
          if [[ ${#notes_args[@]} -eq 0 ]]; then
            echo "Tag has no annotation; auto-generating release notes"
            notes_args=(--generate-notes)
          fi

          shopt -s nullglob
          assets=(.out/*)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "::error::No assets found in .out"
            exit 1
          fi

          echo "Attaching ${#assets[@]} assets:"
          printf '  %s\n' "${assets[@]}"

          # Never pass --draft: the release is published immediately, with no approval step
          gh release create "${TAG}" \
            --verify-tag \
            --title "${TAG}" \
            "${prerelease[@]}" \
            "${notes_args[@]}" \
            "${assets[@]}"

      - name: Job summary
        run: |
          url=$(gh release view "${TAG}" --json url --jq '.url')
          {
            echo "## Release ${TAG}"
            echo
            echo "Published: <${url}>"
          } >> "${GITHUB_STEP_SUMMARY}"
