name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: CI tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: revaulter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CGO_ENABLED: "0"
      GOLANGCI_LINT_VERSION: "v2.13.1"
      TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/revaulter_test?sslmode=disable

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: "client/web/package.json"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "client/web/.nvmrc"
          cache: "pnpm"
          cache-dependency-path: "client/web/pnpm-lock.yaml"

      - name: Check Go dependency minimum age
        run: |
          go tool gomod-age

      - name: Install client dependencies
        working-directory: client/web
        run: |
          pnpm install --frozen-lockfile

      - name: Run biome
        working-directory: client/web
        run: |
          pnpm run check
          pnpm run svelte-check

      - name: Build client
        working-directory: client/web
        run: |
          pnpm run build

      - name: Check diff
        run: |
          make check-config-diff || echo "Please run 'make gen-config'"

      - name: Check DB diff
        env:
          TEST_DATABASE_DSN: ${{ env.TEST_POSTGRES_DSN }}
        run: |
          make check-db-diff || echo "Please run 'make gen-db'"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Run backend tests (SQLite)
        run: |
          make test

      - name: Run backend tests (Postgres)
        env:
          TEST_DATABASE_DSN: ${{ env.TEST_POSTGRES_DSN }}
        run: |
          make test

      - name: Install Playwright browsers
        working-directory: client/web
        run: |
          pnpm run e2e:install

      - name: Run frontend tests
        working-directory: client/web
        run: |
          pnpm run test

      - name: Build E2E server binary
        working-directory: client/web
        run: |
          pnpm run e2e:build-server

      - name: Run E2E tests (SQLite)
        working-directory: client/web
        run: |
          pnpm exec playwright test

      - name: Run E2E tests (Postgres)
        working-directory: client/web
        env:
          E2E_DATABASE_DSN: ${{ env.TEST_POSTGRES_DSN }}
        run: |
          pnpm exec playwright test
